notifications-test {
  database {
    host: "127.0.0.1"
    port: 5432
    url: "jdbc:postgresql://"${notifications-test.database.host}":"${notifications-test.database.port}"/notifications"
    root-password: "password"
    username-prefix: "notifications_test"
    password: "password"
    schema-prefix: "notifications_test"
    domain: "notifications"
    connection-pool: 8
  }

  published-event-bus {
    servers: [{host: "localhost", port: 9092}]
    topic-prefix: "notifications-test"
    cache: { host: "127.0.0.1", port: 6379 }
  }

  internal-event-bus {
    servers: [{host: "localhost", port: 9092}]
    topic-prefix: "notifications-internal-test"
    cache: { host: "127.0.0.1", port: 6379 }
  }

  consumers {
    internal {
      consumer-group: "internal-consumer"
      max-commit-size: 100
      max-commit-time: 5 seconds
    }
    postgres-projection {
      consumer-group  = "postgres-projection"
      max-commit-size = 100
      max-commit-time = 5 seconds
    }
    discussions {
      consumer-group  = "notifications-discussions-consumer"
      max-commit-size = 100
      max-commit-time = 5 seconds
    }
  }
}
