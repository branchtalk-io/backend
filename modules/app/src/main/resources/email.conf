# Email delivery configuration.
# type = "log" (default): tokens are logged to stdout, not emailed.
# type = "smtp": real delivery via SMTP — requires smtp block.
#
# SMTP example (override via env vars or -Demail.type=smtp -Demail.smtp.host=...):
#   email {
#     type = "smtp"
#     smtp {
#       host      = "smtp.example.com"
#       port      = 587
#       username  = "noreply@branchtalk.io"
#       password  = "secret"
#       start-tls = true
#       auth      = true
#       from      = "noreply@branchtalk.io"
#     }
#   }
email {
  type = "log"
  type = ${?EMAIL_TYPE}
}
