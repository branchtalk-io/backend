name: CI build

on:
  push:
    branches: [ master, scala-3-migration ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Cache only dependency artifacts - NOT sbt's global state. sbt 2.x's `test` is incremental (testQuick) and its
      # "already succeeded" record survives `clean`; caching sbt state would make CI skip tests on unchanged sources
      # ("No tests to run"), so we deliberately don't restore it and let every CI run execute the full suite.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-deps-${{ hashFiles('**/*.sbt', 'project/**') }}
          restore-keys: sbt-deps-
      - uses: sbt/setup-sbt@v1
      - uses: extractions/setup-just@v4
      - name: Start Docker images used in IT tests
        run: just dev-bg
      - name: Clean, check code formatting, compile, test
        # sbt 2.x parses one command line: sequence multiple commands with ';' (space-separated no longer works)
        run: sbt "clean; scalafmtCheckAll; fullTest"
      - name: Stop Docker images used in IT tests
        if: always()
        run: just dev-stop
