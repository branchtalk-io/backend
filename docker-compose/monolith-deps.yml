# dependencies: Postgres, Kafka (KRaft, no Zookeeper), Redis

networks:
  branchtalk-monolith:
    driver: bridge

services:
  postgres:
    image: 'postgres:12-alpine'
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    environment:
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - branchtalk-monolith

  kafka:
    image: 'apache/kafka:3.7.0'
    restart: always
    ports:
      - '127.0.0.1:9092:9092'
    environment:
      # KRaft single-node (combined broker + controller)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      # INTERNAL: inter-container, OUTSIDE: host clients (localhost:9092), CONTROLLER: KRaft
      KAFKA_LISTENERS: 'INTERNAL://:9094,CONTROLLER://:9093,OUTSIDE://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9094,OUTSIDE://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - branchtalk-monolith

  redis:
    image: 'redis:7-alpine'
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - branchtalk-monolith

volumes:
  postgres_data:
    driver: local
